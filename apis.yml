aid: shred-video
name: Shred Video
description: >-
  Shred Video automates cinematic video and photo production for adventure
  tourism operators. Using LiDAR, GPS, smart camera technology, and proprietary
  algorithms, the platform automatically captures, edits, and delivers finished
  cinematic videos and photos to a customer's phone within seconds of an
  activity. It serves adventure tour operators such as skydiving centers, bungy
  jumping and giant swing operators, river rafting outfitters, and paragliding
  services, with documented clients including Skydive Utah and AJ Hackett
  locations in Australia and Singapore. Shred Video is a Y Combinator portfolio
  company. As of this enrichment pass the company operates a marketing and
  demo-request website but publishes no public developer API, SDK, documentation
  portal, or machine-readable API surface.
